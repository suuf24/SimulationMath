ht:1.55;margin:0 0 10px;cursor:pointer;border-radius:12px;padding:6px}.question:hover{background:#edf2ff}.translation{display:none;margin:0 0 20px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;background:#fffdf7;color:#475569;line-height:1.5}.translation.show{display:block}.options{display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:#fff;padding:14px 15px;border-radius:15px;cursor:pointer;font-size:16px;line-height:1.35;color:var(--ink);transition:.15s ease}.option.selected{background:var(--soft);border-color:var(--brand);box-shadow:0 0 0 2px rgba(92,127,189,.12)}.letter{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#edf2ff;font-weight:900;flex:0 0 26px}.option.selected .letter{background:var(--brand);color:#fff}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.primary,.secondary{border:none;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff;min-width:130px}.secondary{background:#fffdf7;border:1px solid var(--line);color:var(--ink)}.hint{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.45}.overlay{position:fixed;inset:0;background:rgba(41,50,65,.36);z-index:15;display:none}.overlay.show{display:block}.result-head{text-align:center;margin-bottom:22px}.score{font-size:44px;font-weight:950;color:var(--brand-dark);margin:8px 0}.review-list{display:grid;gap:14px;margin-top:20px}.review-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.review-card.wrong{background:var(--wrong);border-color:#f2b8a8}.review-card.right{background:var(--right);border-color:#abd9bd}.review-title{font-weight:950;margin-bottom:8px}.review-q{line-height:1.45;margin-bottom:10px}.explain{color:#475569;font-size:14px;line-height:1.45;margin-top:8px}.small- </style></head><body><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><p class="side-title">Question Numbers</p><p class="side-note">Tap a number to go back. Blue means answered.</p><div class="number-grid" id="numberGrid"></div></aside><main class="main" id="main"><div class="topbar"><div class="top-left"><button class="menu-btn" id="toggleSidebar">☰</button><div class="title-wrap"><h1>Math Practice - Grade 2</h1><div class="subtitle">30 random questions. Numbers change on every refresh. Tap the question text for Indonesian help.</div></div></div><div class="progress-text" id="progressText">0/30 answered</div></div><div class="content"><section class="card" id="quizCard"></section></div></main><script>

function makeQuestion(q, options, answer, explanation, id_q){
  return { q, options, answer: String(answer), explanation, id_q };
}
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function rand(min,max){ return Math.floor(Math.random() * (max-min+1)) + min; }
function shuffleCopy(array){
  const arr = [...array];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function fracValue(fr){
  const [a,b] = fr.split("/").map(Number);
  return a/b;
}
function uniqueOptions(answer, wrong1, wrong2){
  const opts = [];
  [answer, wrong1, wrong2].forEach(v => {
    v = String(v);
    if(!opts.includes(v)) opts.push(v);
  });
  while(opts.length < 3) opts.push("Not enough information");
  return opts;
}
function idHelp(topic){
  const map = {
    fraction: "Bantuan Indonesia: Soal ini tentang pecahan. Perhatikan jumlah bagian yang sama besar.",
    compareFraction: "Bantuan Indonesia: Bandingkan pecahan. Bisa lebih besar, lebih kecil, atau sama besar.",
    time: "Bantuan Indonesia: Bandingkan lama kegiatan dari jumlah menit atau jam.",
    weight: "Bantuan Indonesia: Bandingkan berat benda. Angka lebih besar berarti lebih berat.",
    group: "Bantuan Indonesia: Hitung jumlah benda dari beberapa kelompok, kotak, atau piring.",
    sale: "Bantuan Indonesia: Perhatikan jumlah awal, beberapa kali terjual, tambahan stok, lalu hitung sisa atau total.",
    tool: "Bantuan Indonesia: Pilih alat ukur yang sesuai, seperti timbangan, penggaris, atau jam.",
    number: "Bantuan Indonesia: Bandingkan atau urutkan bilangan sesuai petunjuk.",
    data: "Bantuan Indonesia: Baca data pada tabel atau diagram, lalu bandingkan jumlahnya."
  };
  return map[topic] || "Bantuan Indonesia: Baca cerita dengan teliti, lalu pilih jawaban yang paling tepat.";
}
const fruits = ["apple","orange","melon","watermelon","banana","mango","papaya","guava","pear","dragon fruit"];
const objects = ["pencils","books","erasers","marbles","candies","stickers","balls","crayons","toy cars","rulers","notebooks","seeds"];
const names = ["Alya","Beni","Cici","Danu","Edo","Fina","Gita","Hadi","Intan","Joko","Kiki","Lina","Made","Nina","Oki","Putri","Rafi","Sari","Tono","Umar","Vina","Wati","Yuda","Zahra","Dito","Rina","Andi","Sinta","Reno","Mira"];
const activities = [
  ["brushing teeth",3],["washing hands",2],["wearing shoes",4],["eating breakfast",15],
  ["reading",20],["walking to school",25],["homework",45],["football practice",60],
  ["watching a movie",90],["visiting grandmother",120],["studying at school",300],["sleeping at night",480]
];

function genFractionShade(){
  const item = pick(["cake","pizza","chocolate bar","watermelon","paper circle","ribbon"]);
  const d = pick([2,3,4,5,6,8,10]);
  const n = rand(1,d-1);
  const ans = `${n}/${d}`;
  return makeQuestion(
    `A ${item} is divided into ${d} equal parts. ${n} part${n>1?"s are":" is"} shaded. Based on the story, the shaded fraction is …`,
    uniqueOptions(ans, `1/${d}`, `${d}/${n}`), ans,
    `${n} shaded part(s) out of ${d} equal parts is ${ans}.`,
    idHelp("fraction")
  );
}
function genFruitPiece(){
  const fruit = pick(fruits);
  const d = pick([2,3,4,5,6,8,10]);
  const eaten = rand(1, Math.min(d-1, 4));
  const ans = `${eaten}/${d}`;
  return makeQuestion(
    `${fruit[0].toUpperCase()+fruit.slice(1)} is cut into ${d} equal pieces. Rina eats ${eaten} piece${eaten>1?"s":""}. Based on the story, the part eaten is …`,
    uniqueOptions(ans, `1/${d}`, `${d}/${eaten}`), ans,
    `${eaten} piece(s) from ${d} equal pieces is ${ans}.`,
    idHelp("fraction")
  );
}
function genCompareFraction(){
  const equalPairs = [["1/2","2/4"],["2/3","4/6"],["1/3","2/6"],["2/5","4/10"],["3/4","6/8"],["1/4","2/8"],["3/5","6/10"]];
  const frs = ["1/2","1/3","1/4","1/5","1/6","1/8","2/3","2/4","2/5","2/6","3/4","3/6","4/8","5/10","3/5","4/6"];
  const mode = pick(["bigger","smaller","equal"]);
  let f1, f2, ans, w1;
  if(mode === "equal"){
    [f1,f2] = pick(equalPairs);
    ans = "both are the same size";
    w1 = `${f1} is bigger`;
  } else {
    do { f1 = pick(frs); f2 = pick(frs); } while(f1 === f2 || Math.abs(fracValue(f1)-fracValue(f2)) < 0.001);
    if(mode === "bigger"){
      ans = fracValue(f1) > fracValue(f2) ? `${f1} is bigger` : `${f2} is bigger`;
      w1 = fracValue(f1) > fracValue(f2) ? `${f2} is bigger` : `${f1} is bigger`;
    } else {
      ans = fracValue(f1) < fracValue(f2) ? `${f1} is smaller` : `${f2} is smaller`;
      w1 = fracValue(f1) < fracValue(f2) ? `${f2} is smaller` : `${f1} is smaller`;
    }
  }
  return makeQuestion(
    `Two children compare ${f1} and ${f2}. Based on the fractions, which statement is correct?`,
    uniqueOptions(ans, w1, "both are the same size"), ans,
    "Compare the value of both fractions carefully.",
    idHelp("compareFraction")
  );
}
function genTime(){
  const mode = pick(["longer","shorter","same","order"]);
  if(mode === "same"){
    const m = pick([10,15,20,30,45]);
    const a = pick(["drawing","reading","cleaning","writing"]);
    let b = pick(["drawing","reading","cleaning","writing"]);
    while(b===a) b = pick(["drawing","reading","cleaning","writing"]);
    return makeQuestion(
      `Alya spends ${m} minutes for ${a}. Beni spends ${m} minutes for ${b}. Based on the story, the time is …`,
      uniqueOptions("both are the same", `${a} takes longer`, `${b} takes longer`), "both are the same",
      `Both activities take ${m} minutes.`,
      idHelp("time")
    );
  }
  if(mode === "order"){
    const ss = shuffleCopy(activities).slice(0,3);
    const ans = [...ss].sort((a,b)=>b[1]-a[1]).map(x=>x[0]).join(" → ");
    const wrong = [...ss].sort((a,b)=>a[1]-b[1]).map(x=>x[0]).join(" → ");
    const text = ss.map(x=>`${x[0]} (${x[1]} minutes)`).join(", ");
    return makeQuestion(
      `Look at these activities: ${text}. Based on the information, the order from the longest time is …`,
      uniqueOptions(ans, wrong, ss.map(x=>x[0]).join(" → ")), ans,
      "Start from the biggest time.",
      idHelp("time")
    );
  }
  let a = pick(activities), b = pick(activities);
  while(a[1] === b[1]) b = pick(activities);
  const longer = a[1] > b[1] ? a : b;
  const shorter = a[1] < b[1] ? a : b;
  const ans = mode === "longer" ? longer[0] : shorter[0];
  const wrong = mode === "longer" ? shorter[0] : longer[0];
  return makeQuestion(
    `Alya spends ${a[1]} minutes for ${a[0]}. Beni spends ${b[1]} minutes for ${b[0]}. Based on the story, the activity that takes ${mode} time is …`,
    uniqueOptions(ans, wrong, "both take the same time"), ans,
    "Compare the minutes.",
    idHelp("time")
  );
}
function genWeight(){
  const mode = pick(["heavier","lighter","same","balance","grams"]);
  let f1 = pick(fruits), f2 = pick(fruits);
  while(f2===f1) f2 = pick(fruits);
  if(mode === "same"){
    const w = rand(2,9);
    const ans = "both have the same weight";
    return makeQuestion(
      `${f1[0].toUpperCase()+f1.slice(1)} weighs ${w} kg. ${f2[0].toUpperCase()+f2.slice(1)} also weighs ${w} kg. Based on the story, the correct statement is …`,
      uniqueOptions(ans, `${f1} is heavier`, `${f2} is lighter`), ans,
      `Both fruits weigh ${w} kg.`,
      idHelp("weight")
    );
  }
  if(mode === "balance"){
    return makeQuestion(
      `On a balance, the side with ${f1} goes down and the side with ${f2} goes up. Based on the picture idea, the heavier fruit is …`,
      uniqueOptions(f1, f2, "both are the same"), f1,
      "On a balance, the lower side is heavier.",
      idHelp("weight")
    );
  }
  let w1 = rand(1,9), w2 = rand(1,9);
  while(w1===w2) w2 = rand(1,9);
  const unit = mode === "grams" ? "grams" : "kg";
  const ans = mode === "lighter" ? (w1<w2 ? f1 : f2) : (w1>w2 ? f1 : f2);
  const wrong = ans === f1 ? f2 : f1;
  const word = mode === "lighter" ? "lighter" : "heavier";
  return makeQuestion(
    `${f1[0].toUpperCase()+f1.slice(1)} weighs ${w1} ${unit}. ${f2[0].toUpperCase()+f2.slice(1)} weighs ${w2} ${unit}. Based on the story, the ${word} fruit is …`,
    uniqueOptions(ans, wrong, "both are the same"), ans,
    `Compare ${w1} and ${w2}.`,
    idHelp("weight")
  );
}
function genGroups(){
  const obj = pick(objects);
  const mode = pick(["sameBoxes","differentBoxes","twoBoxes","plates"]);
  if(mode === "sameBoxes"){
    const b = rand(2,6), p = rand(2,9), total = b*p;
    return makeQuestion(`There are ${b} boxes. Each box has ${p} ${obj}. Based on the story, the total number of ${obj} is …`, uniqueOptions(total,total+b,Math.max(1,total-p)), total, `${b} × ${p} = ${total}.`, idHelp("group"));
  }
  if(mode === "differentBoxes"){
    const a=rand(3,15), b=rand(3,15), c=rand(3,15), total=a+b+c;
    return makeQuestion(`Box A has ${a} ${obj}, Box B has ${b} ${obj}, and Box C has ${c} ${obj}. Based on the story, the total is …`, uniqueOptions(total,a+b,total+3), total, `${a}+${b}+${c}=${total}.`, idHelp("group"));
  }
  if(mode === "plates"){
    const plates = rand(2,6), each = rand(3,10), total = plates*each;
    return makeQuestion(`There are ${plates} plates. Each plate has ${each} seeds. Based on the story, the number of seeds is …`, uniqueOptions(total,total+plates,Math.max(1,total-each)), total, `${plates} × ${each} = ${total}.`, idHelp("group"));
  }
  const a=rand(10,30), b=rand(5,25), total=a+b;
  return makeQuestion(`Rafi has ${a} ${obj} in a blue box and ${b} ${obj} in a red box. Based on the story, he has …`, uniqueOptions(total,Math.abs(a-b),total+10), total, `${a}+${b}=${total}.`, idHelp("group"));
}
function genSales(){
  const obj = pick(objects);
  const mode = pick(["multiSold","restock","compare","compareFewer","same","twoDays"]);
  if(mode === "multiSold" || mode === "restock"){
    const start = rand(40,120), s1 = rand(5,25), s2 = rand(5,25), addNew = mode === "restock" ? rand(3,15) : 0;
    const now = start - s1 - s2 + addNew;
    const q = addNew
      ? `A shop has ${start} ${obj}. In the morning, ${s1} are sold. In the afternoon, ${s2} are sold. Then the shop gets ${addNew} new ${obj}. Based on the story, the number now is …`
      : `A shop has ${start} ${obj}. In the morning, ${s1} are sold. In the afternoon, ${s2} more are sold. Based on the story, the number left is …`;
    return makeQuestion(q, uniqueOptions(now, start-s1, start-s2), now, addNew ? `${start}-${s1}-${s2}+${addNew}=${now}.` : `${start}-${s1}-${s2}=${now}.`, idHelp("sale"));
  }
  const n1 = pick(names), n2 = pick(names);
  if(mode === "same"){
    const s = rand(15,70);
    return makeQuestion(`${n1} sells ${s} ${obj}. ${n2} also sells ${s} ${obj}. Based on the story, the correct statement is …`, uniqueOptions("both sell the same number", `${n1} sells more`, `${n2} sells fewer`), "both sell the same number", `Both sell ${s}.`, idHelp("sale"));
  }
  if(mode === "twoDays"){
    const a=rand(5,30), b=rand(5,30), c=rand(5,30), d=rand(5,30);
    const t1=a+b, t2=c+d;
    if(t1===t2) return genSales();
    const ans = t1>t2 ? n1 : n2;
    const wrong = ans===n1 ? n2 : n1;
    return makeQuestion(`${n1} sells ${a} ${obj} on Monday and ${b} on Tuesday. ${n2} sells ${c} on Monday and ${d} on Tuesday. Based on the story, who sells more in total?`, uniqueOptions(ans, wrong, "both sell the same"), ans, `${n1}: ${t1}. ${n2}: ${t2}.`, idHelp("sale"));
  }
  const a=rand(10,80), b=rand(10,80);
  if(a===b) return genSales();
  const more = a>b ? n1 : n2;
  const fewer = a<b ? n1 : n2;
  const ans = mode === "compareFewer" ? fewer : more;
  const wrong = ans === n1 ? n2 : n1;
  const word = mode === "compareFewer" ? "fewer" : "more";
  return makeQuestion(`${n1} sells ${a} ${obj}. ${n2} sells ${b} ${obj}. Based on the story, who sells ${word}?`, uniqueOptions(ans, wrong, "both sell the same"), ans, "Compare the numbers sold.", idHelp("sale"));
}
function genTool(){
  const scenarios = [
    ["weight of rice","scale","clock","ruler"],
    ["length of a pencil","ruler","scale","calendar"],
    ["time for reading","clock","scale","ruler"],
    ["length of a table","meter stick","scale","cup"],
    ["time to walk to school","clock","ruler","scale"],
    ["weight of mangoes","scale","meter stick","clock"]
  ];
  const [what, ans, w1, w2] = pick(scenarios);
  return makeQuestion(`Mother wants to measure the ${what}. Based on the story, the tool she should use is a …`, uniqueOptions(ans,w1,w2), ans, "Choose the correct measuring tool.", idHelp("tool"));
}
function genNumber(){
  const mode = pick(["greatest","smallest","sign","place","clue"]);
  if(mode === "greatest" || mode === "smallest"){
    const nums = shuffleCopy(Array.from({length:90},(_,i)=>i+10)).slice(0,3);
    const ansArr = [...nums].sort((a,b)=>mode==="greatest"?b-a:a-b);
    const wrongArr = [...nums].sort((a,b)=>mode==="greatest"?a-b:b-a);
    return makeQuestion(`Look at the numbers: ${nums[0]}, ${nums[1]}, and ${nums[2]}. Based on the numbers above, the order from the ${mode} is …`, uniqueOptions(ansArr.join(" - "), wrongArr.join(" - "), nums.join(" - ")), ansArr.join(" - "), "Order the numbers carefully.", idHelp("number"));
  }
  if(mode === "sign"){
    const a = rand(10,99), b = rand(10,99);
    if(a===b) return genNumber();
    const sign = a>b ? ">" : "<";
    return makeQuestion(`Compare the numbers ${a} and ${b}. The correct sign is …`, uniqueOptions(sign, sign===">"?"<":">", "="), sign, `${a} is ${a>b?"greater":"less"} than ${b}.`, idHelp("number"));
  }
  if(mode === "place"){
    const t = rand(2,9), o = rand(0,9), num = t*10+o;
    return makeQuestion(`I am a number. I have ${t} tens and ${o} ones. Based on the clue, the number is …`, uniqueOptions(num, (t-1)*10+o, t*10+((o+3)%10)), num, `${t} tens + ${o} ones = ${num}.`, idHelp("number"));
  }
  const base=rand(20,80), diff=rand(2,9), more = Math.random() < 0.5, ans = more ? base+diff : base-diff;
  const phrase = more ? `${diff} more than ${base}` : `${diff} less than ${base}`;
  return makeQuestion(`A number is ${phrase}. Based on the clue, the number is …`, uniqueOptions(ans, base, ans+diff), ans, `${phrase} = ${ans}.`, idHelp("number"));
}
function genData(){
  const mode = pick(["most","fewest","fruitCount","fruitMore","total"]);
  if(mode === "most" || mode === "fewest"){
    const cls = shuffleCopy(["2A","2B","2C","2D","2E"]).slice(0,3);
    const nums = shuffleCopy(Array.from({length:18},(_,i)=>i+18)).slice(0,3);
    const pairs = cls.map((c,i)=>[c,nums[i]]);
    const chosen = pairs.reduce((best,p)=> mode==="most" ? (p[1]>best[1]?p:best) : (p[1]<best[1]?p:best), pairs[0]);
    const wrong = pairs.find(p=>p[0]!==chosen[0])[0];
    return makeQuestion(`Read the data: Class ${cls[0]} has ${nums[0]} students, class ${cls[1]} has ${nums[1]} students, and class ${cls[2]} has ${nums[2]} students. Based on the data, the class with the ${mode} students is …`, uniqueOptions(chosen[0], wrong, "all classes are the same"), chosen[0], `Look for the ${mode==="most"?"biggest":"smallest"} number.`, idHelp("data"));
  }
  let f1=pick(fruits), f2=pick(fruits); while(f2===f1) f2=pick(fruits);
  let a=rand(5,25), b=rand(5,25); if(a===b) b += 2;
  if(mode === "fruitCount"){
    return makeQuestion(`A fruit chart shows ${a} ${f1}s and ${b} ${f2}s. Based on the chart, the number of ${f1}s is …`, uniqueOptions(a,b,a+b), a, `The chart says ${a}.`, idHelp("data"));
  }
  if(mode === "fruitMore"){
    const ans = a>b ? f1 : f2;
    const wrong = ans===f1 ? f2 : f1;
    return makeQuestion(`A fruit chart shows ${a} ${f1}s and ${b} ${f2}s. Based on the chart, which fruit is more?`, uniqueOptions(ans,wrong,"both are the same"), ans, "The bigger number is more.", idHelp("data"));
  }
  return makeQuestion(`A table shows ${a} ${f1}s and ${b} ${f2}s. Based on the table, the total number of fruits is …`, uniqueOptions(a+b, Math.abs(a-b), Math.max(a,b)), a+b, `${a}+${b}=${a+b}.`, idHelp("data"));
}
const questionGenerators = [genFractionShade, genFruitPiece, genCompareFraction, genTime, genWeight, genGroups, genSales, genTool, genNumber, genData];
function buildFreshQuestionBank(size = 300){
  const bank = [];
  const seen = new Set();
  let guard = 0;
  while(bank.length < size && guard < size * 80){
    const q = pick(questionGenerators)();
    if(!seen.has(q.q)){
      seen.add(q.q);
      bank.push(q);
    }
    guard++;
  }
  return bank;
}
let originalQuestions = buildFreshQuestionBank(300);

const QUESTIONS_PER_SESSION=30;let questions=[];let currentIndex=0;let answers={};let finished=false;
function shuffle(array){const arr=[...array];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function startQuiz(){originalQuestions=buildFreshQuestionBank(300);questions=shuffle(originalQuestions).slice(0,QUESTIONS_PER_SESSION).map(item=>({...item,options:shuffle(item.options)}));currentIndex=0;answers={};finished=false;renderNumbers();renderQuestion();updateProgress()}
function renderNumbers(){const grid=document.getElementById("numberGrid");grid.innerHTML="";questions.forEach((item,i)=>{const btn=document.createElement("button");btn.className="num-btn";btn.textContent=i+1;if(i===currentIndex)btn.classList.add("active");if(answers[i])btn.classList.add("answered");btn.onclick=()=>{currentIndex=i;renderQuestion();renderNumbers();closeSidebarOnMobile()};grid.appendChild(btn)})}
function updateProgress(){const count=Object.keys(answers).length;document.getElementById("progressText").textContent=`${count}/${questions.length} answered`}
function allAnswered(){return Object.keys(answers).length===questions.length}
function renderQuestion(){if(finished){renderResult();return}const item=questions[currentIndex];const selected=answers[currentIndex];const card=document.getElementById("quizCard");const nextLabel=allAnswered()?"Finish":(currentIndex===questions.length-1?"Check":"Next");card.innerHTML=`<div class="question-meta">Question ${currentIndex+1} of ${questions.length}</div><p class="question" id="questionText" title="Tap to show Indonesian help">${item.q}</p><div class="translation" id="translationBox">${item.id_q || ""}</div><div class="options">${item.options.map((opt,idx)=>`<button class="option ${selected===opt?"selected":""}" data-option="${escapeHtml(opt)}"><span class="letter">${String.fromCharCode(65+idx)}</span><span>${opt}</span></button>`).join("")}</div><div class="actions"><button class="secondary" id="prevBtn">${currentIndex===0?"First":"Back"}</button><button class="primary" id="nextBtn">${nextLabel}</button></div><div class="hint">Tap the question text to show Indonesian help.</div>`;const questionText=document.getElementById("questionText");const translationBox=document.getElementById("translationBox");function toggleTranslation(){translationBox.classList.toggle("show");}questionText.addEventListener("click",toggleTranslation);document.querySelectorAll(".option").forEach(btn=>{btn.onclick=()=>{answers[currentIndex]=btn.dataset.option;renderQuestion();renderNumbers();updateProgress()}});document.getElementById("prevBtn").onclick=()=>{if(currentIndex>0){currentIndex--;renderQuestion();renderNumbers()}};document.getElementById("nextBtn").onclick=()=>{if(allAnswered()){finished=true;renderResult();renderNumbers();return}if(currentIndex<questions.length-1){currentIndex++}else{const firstUnanswered=questions.findIndex((_,i)=>!answers[i]);if(firstUnanswered!==-1)currentIndex=firstUnanswered}renderQuestion();renderNumbers()}}
function renderResult(){const results=questions.map((item,i)=>({number:i+1,q:item.q,selected:answers[i],correct:item.answer,ok:answers[i]===item.answer,explanation:item.explanation}));const correctCount=results.filter(r=>r.ok).length;const wrongFirst=[...results].sort((a,b)=>Number(a.ok)-Number(b.ok));const card=document.getElementById("quizCard");card.innerHTML=`<div class="result-head"><div class="question-meta">Result</div><div class="score">${correctCount}/${questions.length}</div><p class="subtitle">Wrong answers are shown first so you can learn them again.</p></div><div class="review-list">${wrongFirst.map(r=>`<div class="review-card ${r.ok?"right":"wrong"}"><div class="review-title">${r.ok?"Correct":"Need Practice"} - Question ${r.number}</div><div class="review-q">${r.q}</div><div><span class="small-label">Your answer:</span> ${r.selected||"-"}</div>${r.ok?"":`<div><span class="small-label">Correct answer:</span> ${r.correct}</div>`}<div class="explain">${r.explanation}</div></div>`).join("")}</div>`}
function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
const sidebar=document.getElementById("sidebar"),main=document.getElementById("main"),overlay=document.getElementById("overlay"),toggleSidebar=document.getElementById("toggleSidebar");function isMobile(){return window.matchMedia("(max-width: 760px)").matches}function openSidebar(){if(isMobile()){sidebar.classList.add("show");sidebar.classList.remove("hidden");overlay.classList.add("show")}else{sidebar.classList.remove("hidden");main.classList.remove("full")}}function closeSidebar(){if(isMobile()){sidebar.classList.remove("show");sidebar.classList.add("hidden");overlay.classList.remove("show")}else{sidebar.classList.add("hidden");main.classList.add("full")}}function closeSidebarOnMobile(){if(isMobile())closeSidebar()}toggleSidebar.onclick=()=>{const mobileOpen=sidebar.classList.contains("show");const desktopHidden=sidebar.classList.contains("hidden")&&!isMobile();if(isMobile()){mobileOpen?closeSidebar():openSidebar()}else{desktopHidden?openSidebar():closeSidebar()}};overlay.onclick=closeSidebar;window.addEventListener("resize",()=>{overlay.classList.remove("show");if(isMobile()){sidebar.classList.remove("show");sidebar.classList.add("hidden");main.classList.add("full")}else{sidebar.classList.remove("show");sidebar.classList.remove("hidden");main.classList.remove("full")}});startQuiz();
</script></body></html>
